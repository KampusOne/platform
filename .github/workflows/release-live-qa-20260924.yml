name: Disposable live release QA

on:
  push:
    branches: [feat/student-ai-profiles-20260924]
    paths:
      - ".github/workflows/release-live-qa-20260924.yml"

# Retry with safe HTTP and capability diagnostics.
permissions:
  contents: read

concurrency:
  group: release-live-qa-20260924
  cancel-in-progress: false

jobs:
  verify:
    if: "github.event.head_commit.message == 'ops: run disposable live release QA'"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: packages/contracts
      - run: npm ci
        working-directory: server
      - name: Run authenticated text and image inference against production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node server/scripts/run-release-live-qa.mjs
