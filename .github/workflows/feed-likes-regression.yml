name: Feed like state regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  like-state:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --test tests/post-like-store.test.ts
