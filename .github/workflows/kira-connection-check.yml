name: Verify live Kira providers
on:
  push:
    branches: [main, fix/academic-uploads-agent-bank-20261014, fix/keyboard-ai-recovery-20261009, perf/secure-universal-cache-20261010, fix/seller-product-management-20261013]
    paths: ['scripts/kira-connection-check.mjs', '.github/workflows/kira-connection-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the real private document reader dependencies
        run: npm ci
        working-directory: server
      - name: Install the shared contract dependencies for the reader bundle
        run: npm ci
        working-directory: packages/contracts
      - name: Verify probe access boundary
        run: node scripts/kira-connection-check.mjs --self-test
      - name: Verify real Standard and Pro inference
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_VERIFY_UPLOADS: "true"
          PROBE_BANKS_ONLY: "false"
          PROBE_METADATA_ONLY: ${{ github.ref == 'refs/heads/perf/secure-universal-cache-20261010' }}
        run: node scripts/kira-connection-check.mjs
