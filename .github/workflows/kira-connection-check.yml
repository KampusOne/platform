name: Verify live Kira providers
on:
  push:
    branches: [main, fix/keyboard-ai-recovery-20261009]
    paths: ['scripts/kira-connection-check.mjs', '.github/workflows/kira-connection-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify probe access boundary
        run: node scripts/kira-connection-check.mjs --self-test
      - name: Verify real Standard and Pro inference
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/kira-connection-check.mjs
