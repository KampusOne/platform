name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-worker.yml"
      - "packages/contracts/**"
      - "server/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: packages/contracts
      - run: npm ci
        working-directory: server
      - run: npm run check && npm test && npm run build
        working-directory: server
      - name: Guard Phase 2 schema activation
        env:
          PHASE_2_MIGRATION_READY: ${{ vars.PHASE_2_MIGRATION_20260912_READY }}
        run: |
          if grep -q '"PHASE_2_SCHEMA_READY": "true"' server/wrangler.jsonc \
            && [ "$PHASE_2_MIGRATION_READY" != "true" ]; then
            echo "Phase 2 cannot be activated until its reviewed migration proof variable is true."
            exit 1
          fi
      - name: Deploy verified Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
