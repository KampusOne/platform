name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-worker.yml"
      - "packages/contracts/**"
      - "packages/design-tokens/**"
      - "portal/**"
      - "mobile/**"
      - ".github/workflows/vercel-prebuilt-deploy.yml"
      - ".github/workflows/android-apk.yml"
      - "server/**"
      - "tests/**"
      - "database/verification/**"
      - "database/neon/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            server/package-lock.json
            mobile/package-lock.json
      - run: npm ci
        working-directory: packages/contracts
      - run: npm ci
        working-directory: server
      - name: Install dependencies for shared mobile session tests
        run: npm ci
        working-directory: mobile
      - run: npm run check && npm test -- --maxWorkers=2 && npm run build
        working-directory: server
      - name: Guard Phase 2 schema activation
        env:
          PHASE_2_MIGRATION_READY: ${{ vars.PHASE_2_MIGRATION_20260912_READY }}
        run: |
          if grep -q '"PHASE_2_SCHEMA_READY": "true"' server/wrangler.jsonc \
            && [ "$PHASE_2_MIGRATION_READY" != "true" ]; then
            echo "Phase 2 cannot be activated until its reviewed migration proof variable is true."
            exit 1
          fi
      - name: Guard Phase 3 schema activation
        env:
          PHASE_3_MIGRATION_READY: ${{ vars.PHASE_3_MIGRATION_20260912_READY }}
        run: |
          if grep -q '"PHASE_3_SCHEMA_READY": "true"' server/wrangler.jsonc \
            && [ "$PHASE_3_MIGRATION_READY" != "true" ]; then
            node server/scripts/verify-schema-proof.mjs phase3
          fi
      - name: Guard unified application schema activation
        env:
          UNIFIED_MIGRATION_READY: ${{ vars.UNIFIED_MIGRATION_20260913_READY }}
        run: |
          if grep -q '"UNIFIED_SCHEMA_READY": "true"' server/wrangler.jsonc \
            && [ "$UNIFIED_MIGRATION_READY" != "true" ]; then
            node server/scripts/verify-schema-proof.mjs unified
          fi
      - name: Guard September 21 correction migrations
        run: node server/scripts/verify-schema-proof.mjs corrections
      - name: Guard current platform and onboarding migrations
        run: node server/scripts/verify-schema-proof.mjs platform
      - name: Guard October 3 experience migrations
        run: node server/scripts/verify-schema-proof.mjs experience
      - name: Guard October 4 correction migrations
        run: node server/scripts/verify-schema-proof.mjs october4
      - name: Guard October correction migrations
        run: node server/scripts/verify-schema-proof.mjs october
      - name: Verify required production secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: server
        run: |
          set -euo pipefail
          npx wrangler secret list --name platformp > "${{ runner.temp }}/kampusone-secret-names.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const raw = readFileSync(process.env.RUNNER_TEMP + '/kampusone-secret-names.json', 'utf8');
          const start = raw.indexOf('['), end = raw.lastIndexOf(']');
          if (start < 0 || end < start) throw new Error('Could not read Worker secret names.');
          const names = new Set(JSON.parse(raw.slice(start, end + 1)).map((entry) => entry.name));
          const required = [
            'DATABASE_URL',
            'JWT_SECRET',
            'OTP_PEPPER',
            'RESEND_API_KEY',
            'PAYSTACK_SECRET_KEY',
            'HF_TOKEN',
          ];
          const missing = required.filter((name) => !names.has(name));
          if (missing.length) {
            console.error('Missing required production Worker secrets: ' + missing.join(', '));
            process.exit(1);
          }
          if (!names.has('RESEND_WEBHOOK_SECRET')) {
            console.warn('RESEND_WEBHOOK_SECRET is not configured; outbound email remains available but signed delivery-event reconciliation stays disabled.');
          }
          console.log('Required production Worker secret names are present.');
          JS
      - name: Prepare initial identity encryption for the same release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node server/scripts/prepare-identity-secrets.mjs "${{ runner.temp }}/kampusone-identity-secrets.json"
      - name: Deploy verified Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy --secrets-file ${{ runner.temp }}/kampusone-identity-secrets.json
      - name: Remove temporary identity configuration
        if: always()
        run: rm -f "${{ runner.temp }}/kampusone-identity-secrets.json"
      - name: Verify production health and authenticated route boundary
        env:
          API_URL: https://platformp.divine-haze-54eb.workers.dev
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 20 "$API_URL/health/ready"
          status=$(curl --silent --show-error --retry 2 --max-time 20 -o /tmp/kampusone-route-check.json -w '%{http_code}' "$API_URL/v1/account/guidelines")
          if [ "$status" != "401" ]; then
            echo "Expected the active route to require authentication (401); received $status."
            exit 1
          fi
