name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-worker.yml"
      - "packages/contracts/**"
      - "server/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Phase 2 reads additive tables and columns. Set this repository variable
    # only after the reviewed migration has passed on a production branch.
    if: ${{ vars.PHASE_2_SCHEMA_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: packages/contracts
      - run: npm ci
        working-directory: server
      - run: npm run check && npm test && npm run build
        working-directory: server
      - name: Deploy verified Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
