name: Verify messaging interaction branch

on:
  push:
    branches:
      - fix/message-reply-actions-20260928
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: messaging-interactions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci
        working-directory: packages/contracts
      - run: npm run check
        working-directory: packages/contracts
      - run: npm test
        working-directory: packages/contracts

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: packages/contracts
      - run: npm ci
        working-directory: server
      - run: npm run check
        working-directory: server
      - name: Review new message interaction migration is present
        run: test -s database/neon/migrations/20260928022000_direct_message_interactions.sql

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run check
        working-directory: mobile
      - run: npm run export:web
        working-directory: mobile
