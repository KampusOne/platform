name: Approved AI schema migration

on:
  push:
    branches: [feat/student-ai-profiles-20260924]
    paths:
      - ".github/workflows/approved-ai-migration-20260924.yml"

permissions:
  contents: read

concurrency:
  group: approved-ai-migration-20260924
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.head_commit.message == 'ops: run approved AI schema migration'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: packages/contracts
      - run: npm ci
        working-directory: server
      - name: Apply exact approved migration through isolated Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/approved-ai-migration-20260924.mjs
