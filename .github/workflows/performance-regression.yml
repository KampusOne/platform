name: Performance regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  loading-and-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --test tests/*.test.mjs tests/post-like-store.test.ts
