name: Verify portal origin repair safety

on:
  push:
    branches: [fix/student-experience-20260926]
    paths:
      - .github/workflows/repair-portal-origins.yml
      - scripts/repair-portal-origins.mjs
      - scripts/repair-portal-origins.test.mjs

permissions:
  contents: read

concurrency:
  group: repair-portal-origins
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify narrow configuration update and regression guards
        run: node --test scripts/repair-portal-origins.test.mjs
