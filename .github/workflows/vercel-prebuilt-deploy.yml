name: Deploy verified Vercel surfaces

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vercel-prebuilt-deploy.yml"

permissions:
  contents: read

concurrency:
  group: vercel-prebuilt-production
  cancel-in-progress: false

jobs:
  portal:
    name: Portal production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    env:
      VERCEL_ORG_ID: team_abQOZYY74aXZM3GdxfmQWmxP
      VERCEL_PROJECT_ID: prj_wFG0WNwuVWk522AL6ocICvgGw2x4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pull Vercel production settings
        run: npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build locally for Vercel
        run: npx --yes vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy prebuilt portal
        id: deploy
        run: |
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Point agent and administration aliases
        run: |
          npx --yes vercel@latest alias set "${{ steps.deploy.outputs.url }}" agents.kampusone.app --scope warriorpikins-projects --token="${{ secrets.VERCEL_TOKEN }}"
          npx --yes vercel@latest alias set "${{ steps.deploy.outputs.url }}" a7f3c9e1b6d2f8a4c5e9b1d7f3a6c2e8.kampusone.app --scope warriorpikins-projects --token="${{ secrets.VERCEL_TOKEN }}"

  mobile-preview:
    name: Mobile preview production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      VERCEL_ORG_ID: team_abQOZYY74aXZM3GdxfmQWmxP
      VERCEL_PROJECT_ID: prj_v9SX7CdbfMvkz7Vq2bVjXZdv88un
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pull Vercel production settings
        run: npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build locally for Vercel
        run: npx --yes vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy prebuilt mobile preview
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

# Triggered for the verified 2026-09-28 portal/mobile release.
