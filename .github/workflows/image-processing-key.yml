name: Verify private image service identity
on:
  push:
    branches: [fix/free-image-processing-20261014]
    paths: ['server/src/lib/image-processing-auth.ts', 'scripts/kira-connection-check.mjs', '.github/workflows/image-processing-key.yml']
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: packages/contracts
      - name: Return only the public image verification key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_IMAGE_KEY_ONLY: 'true'
        run: node scripts/kira-connection-check.mjs
