name: Build Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_run:
    workflows: ["Deploy verified Vercel surfaces"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: android-apk-verified
  cancel-in-progress: false
jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event != 'status' || startsWith(github.event.workflow_run.display_title, 'Verify published Vercel release ')))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Download source receipt from the successful portal release
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: kampusone-verified-web-release
          path: verified-release
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select the verified source revision
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source_sha=$(jq -er --arg run_id "$RELEASE_RUN_ID" --arg sha "$RELEASE_SHA" 'select(.runId == $run_id and .sourceSha == $sha) | .sourceSha | select(test("^[0-9a-f]{40}$"))' verified-release/verified-web-release.json)
          else
            source_sha="$MANUAL_SHA"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
        working-directory: mobile
      - name: Check app types
        run: npm run check
        working-directory: mobile
      - name: Verify production schema and API before packaging
        env:
          API_URL: https://platformp.divine-haze-54eb.workers.dev
        run: |
          node server/scripts/verify-schema-proof.mjs platform
          node server/scripts/verify-schema-proof.mjs october
          curl --fail --silent --show-error --retry 2 --max-time 20 "$API_URL/health/ready"
      - name: Configure Android push credentials
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > mobile/google-services.json
          else
            echo "Firebase push credentials are not configured; APK will build with local alarms only."
          fi
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID || secrets.EXPO_EAS_PROJECT_ID }}
          GOOGLE_SERVICES_JSON_PATH: ./google-services.json
      - name: Build installable APK with bundled JavaScript
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
        env:
          CI: "1"
          NODE_ENV: production
          # Phones reach the verified same-origin Vercel proxy first. This avoids
          # Android/carrier-specific failures against the raw workers.dev hostname while
          # retaining the Worker as a secondary read fallback.
          EXPO_PUBLIC_KAMPUSONE_API_URL: https://kampusone-mobile-preview.vercel.app/api
          EXPO_PUBLIC_KAMPUSONE_API_FALLBACK_URL: https://platformp.divine-haze-54eb.workers.dev
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID || secrets.EXPO_EAS_PROJECT_ID }}
      - name: Prepare public APK
        run: cp mobile/android/app/build/outputs/apk/release/*.apk KampusOne-Android.apk
      - name: Save Android testing artifact
        uses: actions/upload-artifact@v4
        with:
          name: KampusOne-Android-test-${{ steps.source.outputs.sha }}
          path: KampusOne-Android.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish shareable APK release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          test "$BUILD_SHA" = "$(git ls-remote --heads origin main | cut -f1)" || { echo "This build has been superseded; keeping the current public APK."; exit 1; }
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest KampusOne-Android.apk --target "$BUILD_SHA" --title "KampusOne Android Test" --notes "KampusOne Android testing APK built from the verified Worker and Vercel release revision. Verified Vercel API proxy primary for Android reliability; direct Worker retained as fallback. Sideload testing build." --prerelease
# Expo's generated test signing is for sideload testing only. A separately
# provisioned release/upload keystore is required before Play Store publication.

# Manual runs save a test artifact; only a successful verified portal release
# can publish apk-latest. Historical APK snapshots are left unchanged.
