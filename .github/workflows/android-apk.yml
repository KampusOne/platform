name: Build Android test APK
on:
  workflow_dispatch:
    inputs:
      publish_download:
        description: 'Publish this verified build to the website and APK release'
        type: boolean
        default: false
      paystack_fee_setting_checked:
        description: 'Account owner confirmed Pass fees to customers is OFF'
        type: boolean
        default: false
  workflow_run:
    workflows: ["Deploy verified Vercel surfaces"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  apk:
    # Apply concurrency only after this job is eligible to run. Workflow-level
    # concurrency let skipped workflow_run events cancel the real pending APK.
    concurrency:
      group: android-apk-verified
      cancel-in-progress: true
    # Manual runs can build immediately. Automatic follow-up
    # runs are accepted only from the Vercel status verification that actually
    # publishes kampusone-verified-web-release; Worker-triggered deploy runs may
    # succeed without that artifact when VERCEL_TOKEN is unavailable.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'status' && startsWith(github.event.workflow_run.display_title, 'Verify published Vercel release '))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_ANDROID_DISTRIBUTION: direct
    steps:
      - name: Download source receipt from the successful portal release
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: kampusone-verified-web-release
          path: verified-release
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select the verified source revision
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            source_sha=$(jq -er --arg run_id "$RELEASE_RUN_ID" --arg sha "$RELEASE_SHA" 'select(.runId == $run_id and .sourceSha == $sha) | .sourceSha | select(test("^[0-9a-f]{40}$"))' verified-release/verified-web-release.json)
          else
            source_sha="$MANUAL_SHA"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
        working-directory: mobile
      - name: Check app types
        run: npm run check
        working-directory: mobile
      - name: Verify production schema and API before packaging
        env:
          API_URL: https://platformp.divine-haze-54eb.workers.dev
        run: |
          node server/scripts/verify-schema-proof.mjs platform
          node server/scripts/verify-schema-proof.mjs october
          node server/scripts/verify-schema-proof.mjs experience
          node server/scripts/verify-schema-proof.mjs october4
          node server/scripts/verify-schema-proof.mjs october6
          node server/scripts/verify-schema-proof.mjs followup
          curl --fail --silent --show-error --retry 2 --max-time 20 "$API_URL/health/ready"
      - name: Configure Android push credentials
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID || secrets.EXPO_EAS_PROJECT_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ] || [ -z "$EXPO_PUBLIC_EAS_PROJECT_ID" ]; then
            echo "Push-enabled release blocked: configure GOOGLE_SERVICES_JSON_BASE64 and EXPO_EAS_PROJECT_ID in the production environment."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > mobile/google-services.json
          node mobile/scripts/verify-push-build.cjs
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID || secrets.EXPO_EAS_PROJECT_ID }}
          GOOGLE_SERVICES_JSON_PATH: ./google-services.json
      - name: Build installable APK with bundled JavaScript
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
        env:
          CI: "1"
          NODE_ENV: production
          # Phones reach the verified same-origin Vercel proxy first. This avoids
          # Android/carrier-specific failures against the raw workers.dev hostname while
          # retaining the Worker as a secondary read fallback.
          EXPO_PUBLIC_KAMPUSONE_API_URL: https://mobile.kampusone.app/api
          EXPO_PUBLIC_KAMPUSONE_API_FALLBACK_URL: https://platformp.divine-haze-54eb.workers.dev
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID || secrets.EXPO_EAS_PROJECT_ID }}
      - name: Prepare public APK
        run: cp mobile/android/app/build/outputs/apk/release/*.apk KampusOne-Android.apk
      - name: Verify packaged APK identity and record the build receipt
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, readdirSync, statSync, writeFileSync, createReadStream } from 'node:fs';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const expected = JSON.parse(readFileSync('mobile/app.json', 'utf8')).expo;
          const sdkRoot = process.env.ANDROID_HOME || process.env.ANDROID_SDK_ROOT;
          if (!sdkRoot) throw new Error('Android SDK path is required to inspect the built APK.');
          const buildTools = join(sdkRoot, 'build-tools');
          const aapt = readdirSync(buildTools).sort((a, b) => b.localeCompare(a, undefined, { numeric: true }))
            .map(version => join(buildTools, version, 'aapt')).find(existsSync);
          if (!aapt) throw new Error('Android build tools must include aapt for APK identity verification.');
          const inspected = spawnSync(aapt, ['dump', 'badging', 'KampusOne-Android.apk'], { encoding: 'utf8' });
          if (inspected.status !== 0) throw new Error('The built APK could not be inspected.');
          const packageLine = inspected.stdout.split('\n').find(line => line.startsWith('package: ')) || '';
          const values = Object.fromEntries([...packageLine.matchAll(/([A-Za-z][A-Za-z0-9]*)='([^']*)'/g)].map(match => [match[1], match[2]]));
          const targetSdkVersion=Number(/^targetSdkVersion:'(\d+)'$/m.exec(inspected.stdout)?.[1]);
          if(!Number.isInteger(targetSdkVersion)||targetSdkVersion<36)throw new Error('Android release must target API 36 or higher.');
          if (values.name !== expected.android.package || values.versionName !== expected.version || Number(values.versionCode) !== expected.android.versionCode)
            throw new Error('The packaged APK identity does not match the reviewed application configuration.');
          if (!/^[a-f0-9]{40}$/.test(process.env.BUILD_SHA || '')) throw new Error('A verified source revision is required for the APK receipt.');
          const digest = createHash('sha256');
          for await (const chunk of createReadStream('KampusOne-Android.apk')) digest.update(chunk);
          const apksigner = readdirSync(buildTools).sort((a,b)=>b.localeCompare(a,undefined,{numeric:true})).map(v=>join(buildTools,v,'apksigner')).find(existsSync);
          if(!apksigner)throw new Error('apksigner is required to verify the packaged signing certificate.');
          const signed=spawnSync(apksigner,['verify','--print-certs','KampusOne-Android.apk'],{encoding:'utf8'});
          const rawCert=/\bcertificate SHA-256 digest:\s*([a-f0-9:]{64,95})/i.exec(signed.stdout)?.[1];
          const cert=rawCert?.replaceAll(':','').toUpperCase();
          if(signed.status!==0||!cert||!/^[A-F0-9]{64}$/.test(cert))throw new Error(`The APK signing identity could not be verified. ${signed.stderr || 'No valid certificate digest was reported.'}`);
          const certificateSha256=cert.match(/.{2}/g).join(':');
          const receipt = { certificateSha256, sourceSha: process.env.BUILD_SHA, packageName: values.name, versionName: values.versionName,
            versionCode: Number(values.versionCode), targetSdkVersion, apkSha256: digest.digest('hex'), apkSizeBytes: statSync('KampusOne-Android.apk').size,
            verifiedAt: new Date().toISOString() };
          writeFileSync('KampusOne-Android-build.json', JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify(receipt));
          JS
      - name: Save the verified APK build receipt
        uses: actions/upload-artifact@v4
        with:
          name: KampusOne-Android-build-${{ steps.source.outputs.sha }}
          path: KampusOne-Android-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Save Android testing artifact
        uses: actions/upload-artifact@v4
        with:
          name: KampusOne-Android-test-${{ steps.source.outputs.sha }}
          path: KampusOne-Android.apk
          if-no-files-found: error
          retention-days: 14
      - name: Reverify the published web release before an explicitly requested APK publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish_download && inputs.paystack_fee_setting_checked
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-worker.yml/runs" -f branch=main -f head_sha="$RELEASE_SHA" > /tmp/kampusone-worker-runs.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/status" > /tmp/kampusone-vercel-statuses.json
          node server/scripts/verify-published-web-release.mjs /tmp/kampusone-worker-runs.json /tmp/kampusone-vercel-statuses.json /tmp/kampusone-apk-publication-proof.json
      - name: Publish the verified APK to website downloads
        if: github.event_name == 'workflow_dispatch' && inputs.publish_download && inputs.paystack_fee_setting_checked
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          test "$BUILD_SHA" = "$(git ls-remote --heads origin main | cut -f1)"
          node server/scripts/publish-android-download.mjs
      - name: Publish shareable APK release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_download && inputs.paystack_fee_setting_checked
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          test "$BUILD_SHA" = "$(git ls-remote --heads origin main | cut -f1)" || { echo "This build has been superseded; keeping the current public APK."; exit 1; }
          version=$(jq -er '.versionName' KampusOne-Android-build.json)
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest KampusOne-Android.apk KampusOne-Android-build.json --target "$BUILD_SHA" --title "KampusOne Android $version" --notes "KampusOne Android testing APK built from the verified Worker and Vercel release revision. Packaged Android identity and SHA256 are recorded in the attached build receipt. Verified Vercel API proxy primary for Android reliability; direct Worker retained as fallback. Sideload testing build." --prerelease
# Expo's generated test signing is for sideload testing only. A separately
# provisioned release/upload keystore is required before Play Store publication.

# Automatic runs save review artifacts. Publishing requires explicit manual
# inputs and renewed matching Worker/Vercel verification. Historical snapshots
# are left unchanged.
