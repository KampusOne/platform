name: Apply verified student feature source
on:
  push:
    branches: [feat/student-ai-profiles-20260924]
    paths: [.github/workflows/student-ai-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/student-ai-profiles-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-ai-profiles-20260924
      - name: Verify every source and target hash before editing
        shell: bash
        run: |
          python3 <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          parts = [root / f'scripts/student-edits-part-{i}.b64' for i in range(1, 5)]
          encoded = ''.join(p.read_text().strip() for p in parts)
          assert len(encoded) == 61784, 'Transfer length mismatch'
          raw = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=268435456)
          assert hashlib.sha256(raw).hexdigest() == 'f4b16c7c6720ebcf170c1bb5ff858654302001d7de4bbfc6c91d49c6d23df542', 'Manifest checksum mismatch'
          edits = json.loads(raw)
          assert len(edits) == 47
          prepared = []
          seen = set()
          for edit in edits:
              rel = pathlib.PurePosixPath(edit['p'])
              assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts
              assert edit['p'] not in seen
              seen.add(edit['p'])
              target = root.joinpath(*rel.parts)
              assert target.resolve().is_relative_to(root) and not target.is_symlink()
              assert all(not parent.is_symlink() for parent in target.parents if parent != root)
              before = target.read_bytes() if target.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None) == edit['b'], 'Source changed: ' + edit['p']
              if edit.get('delete'):
                  after = None
              elif 'raw' in edit:
                  after = base64.b64decode(edit['raw'], validate=True)
              else:
                  lines = (before or b'').decode('utf-8').splitlines(keepends=True)
                  for start, end, replacement in reversed(edit['ops']):
                      assert 0 <= start <= end <= len(lines)
                      lines[start:end] = [replacement]
                  after = ''.join(lines).encode('utf-8')
              assert (hashlib.sha256(after).hexdigest() if after is not None else None) == edit['a'], 'Target mismatch: ' + edit['p']
              prepared.append((edit['p'], target, after))
          for name, target, data in prepared:
              if name.startswith('.github/workflows/'):
                  continue
              if data is None:
                  target.unlink()
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              subprocess.run(['git', 'add', '--', name], check=True)
          for part in parts:
              subprocess.run(['git', 'rm', '--', str(part.relative_to(root))], check=True)
          print('Verified 47 source/target hashes; application source staged. Workflow changes will be applied through the authorized connector.')
          PY
      - name: Commit application source without altering workflow permissions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat: simplify student AI, enforce shared trials, and add public profiles'
          git push origin HEAD:feat/student-ai-profiles-20260924
