name: Verify platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci
        working-directory: packages/contracts
      - run: npm run check
        working-directory: packages/contracts
      - run: npm test
        working-directory: packages/contracts

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: packages/contracts
      - run: npm ci
        working-directory: server
      - run: npm run check
        working-directory: server
      - run: npm test
        working-directory: server
      - name: Verify password hashing in Workers runtime
        working-directory: server
        run: |
          set -euo pipefail
          npx wrangler dev --local --port 8799 --var ENVIRONMENT:local > /tmp/kampusone-worker.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if response=$(curl --silent --show-error --fail --max-time 15 http://127.0.0.1:8799/health/crypto); then
              echo "$response"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/kampusone-worker.log
          exit 1
      - run: npm run build
        working-directory: server

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
        working-directory: portal
      - run: npm run lint
        working-directory: portal
      - run: npm run check
        working-directory: portal
      - run: npm run build
        working-directory: portal

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run check
        working-directory: mobile
      - run: npm run export:web
        working-directory: mobile

  database-review:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check migration and verification records
        run: |
          test -s database/supabase/migrations/20260909213215_foundation.sql
          test -s database/neon/migrations/20260912000000_phase_2_learning_pilot.sql
          test -s database/verification/phase_0_security.sql
          secret_pattern='sb_''secret_|service_''role|SUPABASE_''SECRET_KEY=.'
          ! grep -R --line-number --extended-regexp "$secret_pattern" \
            --exclude='*.example' \
            --exclude='*.md' \
            --exclude='*.sql' \
            --exclude-dir='.git' \
            .
