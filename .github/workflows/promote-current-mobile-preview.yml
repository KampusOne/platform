name: Promote current mobile preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-current-mobile-preview.yml"

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_ALT: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_API: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_PROJECT_ID: prj_v9SX7CdbfMvkz7Vq2bVjXZdv88un
      VERCEL_TEAM_ID: team_abQOZYY74aXZM3GdxfmQWmxP
      VERCEL_DEPLOYMENT_ID: dpl_Jzp8xt69P6zRdc2UEYLmTpbUhz1o
    steps:
      - name: Promote verified build 33 without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          token="${VERCEL_TOKEN_PRIMARY:-}"
          if [ -z "$token" ]; then token="${VERCEL_TOKEN_ALT:-}"; fi
          if [ -z "$token" ]; then token="${VERCEL_TOKEN_API:-}"; fi
          if [ -z "$token" ]; then
            echo "No Vercel API token secret is available to GitHub Actions."
            exit 2
          fi
          code=$(curl --silent --show-error --output /tmp/vercel-promote.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $token" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$VERCEL_DEPLOYMENT_ID?teamId=$VERCEL_TEAM_ID")
          cat /tmp/vercel-promote.json || true
          if [ "$code" != "201" ] && [ "$code" != "202" ]; then
            echo "Vercel promote failed with HTTP $code"
            exit 1
          fi
