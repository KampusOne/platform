name: Read-only Gemini credential probe

on:
  push:
    branches: [main]
    paths: [".github/workflows/gemini-credential-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-credential-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check active Gemini credential using an expiring, token-protected remote preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          import assert from 'node:assert/strict';

          // This function is uploaded ONLY to a short-lived remote development
          // preview, never to the live Worker. It receives just the inherited
          // Gemini bindings. No database, user identity, documents or inference.
          async function probeHandler(request, env) {
            const reply = body => Response.json({ kind: 'kampusone-gemini-probe-v1', ...body }, { headers: { 'Cache-Control': 'no-store' } });
            const expiry = Number(env.PROBE_EXPIRES_AT);
            const supplied = request.headers.get('x-probe-token') ?? '';
            if (request.method !== 'POST' || new URL(request.url).pathname !== '/__ai_connection_probe' || !/^[a-f0-9]{64}$/.test(env.PROBE_TOKEN ?? '') || !/^[a-f0-9]{64}$/.test(supplied) || !Number.isFinite(expiry) || expiry <= Date.now() || expiry > Date.now() + 240000) return new Response(null, { status: 404 });
            let difference = 0;
            for (let i = 0; i < 64; i++) difference |= supplied.charCodeAt(i) ^ env.PROBE_TOKEN.charCodeAt(i);
            if (difference) return new Response(null, { status: 404 });
            if (env.AI_ASSISTANT_ENABLED !== 'true') return reply({ outcome: 'ai_paused' });
            const key = typeof env.GEMINI_API_KEY === 'string' ? env.GEMINI_API_KEY.trim() : '';
            const model = typeof env.GEMINI_MODEL === 'string' ? env.GEMINI_MODEL.trim().replace(/^models\//, '') : '';
            if (!key || !model) return reply({ outcome: 'configuration_missing' });
            const format = key.startsWith('AQ.') ? 'aq_format' : key.startsWith('AIza') ? 'aiza_format' : 'other_format';
            if (/\s|["'\u2018\u2019\u201c\u201d]/.test(key) || /^(?:GEMINI_API_KEY|GOOGLE_API_KEY)\s*=/.test(key)) return reply({ outcome: 'local_key_format', format });
            if (!/^gemini-[a-zA-Z0-9._-]{1,100}$/.test(model)) return reply({ outcome: 'model_setting_invalid', format });
            const reasons = new Set(['API_KEY_INVALID','API_KEY_EXPIRED','API_KEY_NOT_FOUND','API_KEY_SERVICE_BLOCKED','API_KEY_HTTP_REFERRER_BLOCKED','API_KEY_IP_ADDRESS_BLOCKED','API_KEY_ANDROID_APP_BLOCKED','API_KEY_IOS_APP_BLOCKED','ACCESS_TOKEN_TYPE_UNSUPPORTED','ACCESS_TOKEN_EXPIRED','CREDENTIALS_MISSING','SERVICE_DISABLED','CONSUMER_INVALID','CONSUMER_SUSPENDED','BILLING_DISABLED','USER_PROJECT_DENIED','IAM_PERMISSION_DENIED','RATE_LIMIT_EXCEEDED','RESOURCE_EXHAUSTED','SECURITY_POLICY_VIOLATED']);
            const statuses = new Set(['INVALID_ARGUMENT','UNAUTHENTICATED','PERMISSION_DENIED','NOT_FOUND','FAILED_PRECONDITION','RESOURCE_EXHAUSTED','INTERNAL','UNAVAILABLE','DEADLINE_EXCEEDED']);
            try {
              // Metadata only: no generated tokens and no paid inference call.
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}`, { headers: { 'x-goog-api-key': key }, redirect: 'error', signal: AbortSignal.timeout(15000) });
              if (response.ok) {
                await response.body?.cancel().catch(() => undefined);
                return reply({ outcome: 'google_accepted', http: response.status, format });
              }
              const reader = response.body?.getReader();
              const chunks = []; let length = 0, complete = true;
              try {
                if (reader) for (;;) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  length += value.length;
                  if (length > 16384) { complete = false; await reader.cancel(); break; }
                  chunks.push(value);
                }
              } finally { reader?.releaseLock(); }
              let payload = {};
              if (complete) {
                const bytes = new Uint8Array(length); let offset = 0;
                for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.length; }
                try { payload = JSON.parse(new TextDecoder().decode(bytes)); } catch { /* Raw body is never emitted. */ }
              }
              const error = payload && typeof payload === 'object' ? payload.error : undefined;
              const reason = Array.isArray(error?.details) ? error.details.map(item => item?.reason).find(value => reasons.has(value)) : undefined;
              const status = statuses.has(error?.status) ? error.status : undefined;
              const message = typeof error?.message === 'string' ? error.message.toLowerCase() : '';
              // Message-derived labels are constants, not upstream text.
              const hint = message.includes('reported as leaked') ? 'known_leaked_key' : message.includes('project has been denied access') ? 'project_access_denied' : 'none';
              return reply({ outcome: 'google_rejected', http: response.status, format, reason: reason ?? 'UNCLASSIFIED', status: status ?? 'UNCLASSIFIED', hint });
            } catch { return reply({ outcome: 'network_failure', format }); }
          }

          // Prove the preview gate and output redaction before any live access.
          const nonce = randomBytes(32).toString('hex');
          const testEnv = { PROBE_TOKEN: nonce, PROBE_EXPIRES_AT: String(Date.now() + 180000), AI_ASSISTANT_ENABLED: 'true', GEMINI_API_KEY: 'AQ.synthetic-test-value', GEMINI_MODEL: 'gemini-test-model' };
          const testRequest = (token = nonce) => new Request('https://example.invalid/__ai_connection_probe', { method: 'POST', headers: { 'x-probe-token': token } });
          const realFetch = globalThis.fetch;
          let calls = 0;
          try {
            globalThis.fetch = async () => { calls++; return Response.json({ error: { status: 'UNAUTHENTICATED', message: 'PRIVATE_INPUT AQ.synthetic-test-value', details: [{ reason: 'ACCESS_TOKEN_TYPE_UNSUPPORTED', metadata: { secret: 'PRIVATE_INPUT' } }] } }, { status: 401 }); };
            assert.equal((await probeHandler(testRequest('0'.repeat(64)), testEnv)).status, 404);
            assert.equal((await probeHandler(testRequest(), { ...testEnv, PROBE_EXPIRES_AT: '0' })).status, 404);
            assert.equal(calls, 0);
            const result = await (await probeHandler(testRequest(), testEnv)).json();
            assert.equal(result.reason, 'ACCESS_TOKEN_TYPE_UNSUPPORTED');
            assert.equal(JSON.stringify(result).includes('PRIVATE_INPUT'), false);
            assert.equal(JSON.stringify(result).includes('synthetic-test-value'), false);
            const quoted = await (await probeHandler(testRequest(), { ...testEnv, GEMINI_API_KEY: '"AQ.synthetic-test-value"' })).json();
            assert.equal(quoted.outcome, 'local_key_format');
            assert.equal(calls, 1);
          } finally { globalThis.fetch = realFetch; }
          console.log('PASS: preview authorization, expiry, formatting detection and secret-redaction self-tests.');

          const lines = ['# Read-only Gemini credential probe', '', 'No production deployment, secret replacement, inference, user request, database access or billing change. The provider credential stays inside Cloudflare; only allowlisted diagnostics leave the preview.', ''];
          const report = text => { console.log(text); lines.push(text); };
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const cfToken = process.env.CLOUDFLARE_API_TOKEN;
          let stage = 'configuration';
          const fetchSafe = (url, options = {}) => fetch(url, { ...options, redirect: 'error', signal: AbortSignal.timeout(20000) });
          const cf = async (suffix, options = {}) => {
            const response = await fetchSafe(`https://api.cloudflare.com/client/v4/accounts/${account}${suffix}`, { ...options, headers: { Authorization: `Bearer ${cfToken}`, ...options.headers } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const payload = await response.json();
            if (!payload.success) throw new Error('Cloudflare operation not successful');
            return payload.result;
          };
          try {
            if (!cfToken || !/^[a-f0-9]{32}$/i.test(account ?? '')) throw new Error('Deployment credentials unavailable');
            stage = 'read active Worker binding metadata';
            const settings = await cf('/workers/scripts/platformp/settings');
            const names = ['GEMINI_API_KEY', 'GEMINI_MODEL', 'AI_ASSISTANT_ENABLED'];
            for (const name of names) if (!settings.bindings?.some(binding => binding.name === name)) throw new Error('Required binding missing');
            if (settings.bindings.find(binding => binding.name === 'GEMINI_API_KEY')?.type !== 'secret_text') throw new Error('Gemini key is not stored as a secret');
            report('PASS: required production bindings exist; key value not read by CI.');
            stage = 'create temporary remote preview session';
            const session = await cf('/workers/scripts/platformp/subdomain/edge-preview');
            let sessionToken = session.token;
            let previewHost = 'platformp.divine-haze-54eb.workers.dev';
            if (session.exchange_url) {
              const exchange = new URL(session.exchange_url);
              if (exchange.protocol !== 'https:' || !['.cloudflarepreviews.com', '.workers.dev'].some(suffix => exchange.hostname.endsWith(suffix))) throw new Error('Unexpected preview host');
              const response = await fetchSafe(exchange.href);
              if (response.ok) { const data = await response.json(); if (typeof data.token === 'string') sessionToken = data.token; }
              previewHost = 'platformp' + exchange.hostname.slice(exchange.hostname.indexOf('.'));
            }
            if (typeof sessionToken !== 'string') throw new Error('Preview session token missing');
            const probeToken = randomBytes(32).toString('hex');
            const metadata = { main_module: 'probe.mjs', compatibility_date: '2026-09-09', bindings: [
              ...names.map(name => ({ name, type: 'inherit' })),
              { name: 'PROBE_TOKEN', type: 'plain_text', text: probeToken },
              { name: 'PROBE_EXPIRES_AT', type: 'plain_text', text: String(Date.now() + 180000) },
            ] };
            const form = new FormData();
            form.set('metadata', JSON.stringify(metadata));
            form.set('probe.mjs', new Blob([`export default { fetch: ${probeHandler.toString()} };`], { type: 'application/javascript+module' }), 'probe.mjs');
            form.set('wrangler-session-config', JSON.stringify({ workers_dev: true }));
            stage = 'upload isolated preview (not deploy)';
            const preview = await cf('/workers/scripts/platformp/edge-preview', { method: 'POST', body: form, headers: { 'cf-preview-upload-config-token': sessionToken } });
            if (typeof preview.preview_token !== 'string') throw new Error('Preview access token missing');
            stage = 'invoke read-only Gemini probe';
            const response = await fetchSafe(`https://${previewHost}/__ai_connection_probe`, { method: 'POST', headers: { 'cf-workers-preview-token': preview.preview_token, 'x-probe-token': probeToken } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();
            if (result.kind !== 'kampusone-gemini-probe-v1') throw new Error('Unexpected probe result');
            // Second output allowlist: never print arbitrary preview response data.
            const words = new Set(['ai_paused','configuration_missing','local_key_format','model_setting_invalid','google_accepted','google_rejected','network_failure','aq_format','aiza_format','other_format','known_leaked_key','project_access_denied','none','UNCLASSIFIED','API_KEY_INVALID','API_KEY_EXPIRED','API_KEY_NOT_FOUND','API_KEY_SERVICE_BLOCKED','API_KEY_HTTP_REFERRER_BLOCKED','API_KEY_IP_ADDRESS_BLOCKED','API_KEY_ANDROID_APP_BLOCKED','API_KEY_IOS_APP_BLOCKED','ACCESS_TOKEN_TYPE_UNSUPPORTED','ACCESS_TOKEN_EXPIRED','CREDENTIALS_MISSING','SERVICE_DISABLED','CONSUMER_INVALID','CONSUMER_SUSPENDED','BILLING_DISABLED','USER_PROJECT_DENIED','IAM_PERMISSION_DENIED','RATE_LIMIT_EXCEEDED','RESOURCE_EXHAUSTED','SECURITY_POLICY_VIOLATED','INVALID_ARGUMENT','UNAUTHENTICATED','PERMISSION_DENIED','NOT_FOUND','FAILED_PRECONDITION','INTERNAL','UNAVAILABLE','DEADLINE_EXCEEDED']);
            for (const field of ['outcome','format','reason','status','hint']) if (words.has(result[field])) report(`${field}: ${result[field]}`);
            if (Number.isInteger(result.http) && result.http >= 100 && result.http <= 599) report(`Google HTTP status: ${result.http}`);
            report('No inference attempted. A metadata success is not proof of a working study answer.');
            report('The temporary probe expires after three minutes. Production code, authentication, quota and secrets remain unchanged.');
          } catch (error) {
            const detail = /^HTTP [1-5][0-9]{2}$/.test(error?.message ?? '') ? error.message : 'raw response/error withheld';
            report(`CHECK FAILED at ${stage}: ${detail}.`);
            process.exitCode = 1;
          } finally {
            if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          }
          NODE
