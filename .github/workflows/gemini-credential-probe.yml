name: Gemini connection diagnostic

on:
  workflow_dispatch:
    inputs:
      inference:
        description: "Run one fixed academic generation request (maximum 128 output tokens) instead of metadata only"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gemini-credential-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate diagnostic before using the live connection
        run: node scripts/gemini-connection-probe.mjs --self-test
      - name: Check Gemini without exposing credentials or user data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_INFERENCE: ${{ inputs.inference }}
        run: node scripts/gemini-connection-probe.mjs
