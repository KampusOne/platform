name: Refresh native analytics lockfile

on:
  push:
    branches:
      - analytics/native-firebase-streams-20260929

permissions:
  contents: write

jobs:
  lockfile-and-prebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Resolve native analytics dependencies
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Verify Expo native prebuild configuration
        working-directory: mobile
        run: npx expo prebuild --clean --no-install
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "analytics: refresh mobile lockfile"
            git push origin HEAD:analytics/native-firebase-streams-20260929
          fi
