name: Verify comment interactions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  comment-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --test tests/feed-comment-interactions.test.mjs tests/feed-comment-replies.test.mjs
