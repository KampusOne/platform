name: Media regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  media-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check media links, crop boundaries, Save and Cancel
        run: node --experimental-strip-types --test tests/media-workflow.test.mjs
