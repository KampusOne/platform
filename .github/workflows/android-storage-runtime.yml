name: Verify Android draft storage runtime
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/android-storage-runtime.yml']
permissions:
  contents: read
concurrency:
  group: android-storage-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storage-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_KAMPUSONE_API_URL: https://api.example.invalid
      EXPO_PUBLIC_KAMPUSONE_API_FALLBACK_URL: https://api.example.invalid
      EXPO_PUBLIC_EAS_PROJECT_ID: 00000000-0000-4000-8000-000000000000
      GOOGLE_SERVICES_JSON_PATH: ./google-services.compile-only.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install locked dependencies
        working-directory: mobile
        run: npm ci
      - name: Select CI-only native smoke entry point and fixture
        working-directory: mobile
        run: |
          node scripts/native-compile-fixture.cjs
          node -e 'const fs=require("fs"),p=require("./package.json");p.main="scripts/native-storage-smoke.tsx";fs.writeFileSync("package.json",JSON.stringify(p,null,2))'
          npx expo prebuild --platform android --no-install --skip-dependency-update react-native,react
      - name: Assemble isolated smoke APK with debug signing and Hermes
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --max-workers=2 --no-daemon
      - name: Enable hardware acceleration for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise storage on Android 35 through the real JS and native bridges
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -cores 2 -memory 2048
          disable-animations: true
          working-directory: mobile
          script: bash scripts/run-native-storage-smoke.sh
      - name: Upload synthetic runtime verification only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-draft-storage-runtime-proof
          path: mobile/native-storage-proof/
          retention-days: 7
          if-no-files-found: warn
