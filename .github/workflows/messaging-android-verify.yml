name: Verify messaging Android bundle

on:
  push:
    branches:
      - fix/message-reply-actions-20260928

permissions:
  contents: read

concurrency:
  group: messaging-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run check
        working-directory: mobile
      - run: npx expo export --platform android --output-dir dist-android
        working-directory: mobile
