name: Live Worker auth reachability check 20260927

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-worker-hotfix-20260927.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact APK API origin
        env:
          API_URL: https://platformp.divine-haze-54eb.workers.dev
        run: |
          set -euo pipefail
          echo "Checking ready endpoint"
          time curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$API_URL/health/ready"
          echo
          echo "Checking password login route reaches the Worker and database"
          status=$(curl --silent --show-error --connect-timeout 5 --max-time 10             -o /tmp/login.json -w '%{http_code}'             -H 'Content-Type: application/json'             --data '{"email":"apk-probe-invalid@kampusone.app","password":"not-a-real-password","deviceLabel":"KampusOne auth probe"}'             "$API_URL/v1/auth/login")
          cat /tmp/login.json
          echo
          echo "HTTP $status"
          test "$status" = "401"
