name: Live Kira voice persistence hotfix 20260927

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-worker-hotfix-20260927.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bba30bd5b03032be976c3e302f32b4726a409427
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            server/package-lock.json
            mobile/package-lock.json
      - run: npm ci
        working-directory: packages/contracts
      - run: npm ci
        working-directory: server
      - name: Install dependencies for shared session tests
        run: npm ci
        working-directory: mobile
      - name: Verify pinned Kira voice Worker
        run: npm run check && npm test -- --maxWorkers=2 && npm run build
        working-directory: server
      - name: Deploy pinned Kira voice Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
      - name: Verify live Kira voice route boundary
        env:
          API_URL: https://platformp.divine-haze-54eb.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 20 "$API_URL/health/ready"
          request_id=11111111-1111-4111-8111-111111111111
          status=$(curl --silent --show-error --retry 2 --max-time 20 \
            -o /tmp/kira-voice.json -w '%{http_code}' \
            -X POST -H 'Content-Type: audio/mp4' --data-binary 'probe' \
            "$API_URL/v1/ai/transcribe?idempotencyKey=$request_id&consent=true")
          cat /tmp/kira-voice.json
          echo
          echo "Kira voice boundary HTTP $status"
          test "$status" = "401"
