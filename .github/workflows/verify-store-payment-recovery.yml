name: Verify saved store payment receipts
on:
  push:
    branches: [fix/timetable-import-completion-20261014]
    paths: ['server/scripts/verify-saved-store-payments.ts', '.github/workflows/verify-store-payment-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: packages/contracts
      - name: Independently verify saved checkout receipts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_COLLECTIONS_ONLY: 'true'
        run: node scripts/kira-connection-check.mjs
