name: Feed interaction regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  feed-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --test tests/feed-post-text.test.mjs tests/feed-social.test.mjs
