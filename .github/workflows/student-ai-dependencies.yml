name: Student AI validation dependencies
on:
  push:
    branches: [feat/student-ai-profiles-20260924]
    paths: [.github/workflows/student-ai-dependencies.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: packages/contracts
      - run: npm ci
        working-directory: mobile
      - name: Package mobile validation dependencies
        run: tar -czf mobile-validation-deps.tar.gz mobile/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-validation-deps
          path: mobile-validation-deps.tar.gz
          retention-days: 1
