<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="referrer" content="no-referrer">
<title>Learning document</title>
<style>
@font-face{font-family:Inter;src:url('/documents/inter.ttf');font-display:swap}*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{--canvas:#fbf7f2;--surface:#fff;--ink:#29231f;--muted:#75685e;--brand:#a8462e;--border:#ded4cb;--reader:#eae3db;background:var(--canvas);color:var(--ink);font:14px Inter,system-ui,sans-serif;display:flex;flex-direction:column}body[data-theme=dark]{--canvas:#211b17;--surface:#302721;--ink:#fbf7f2;--muted:#c4b5a8;--brand:#e9b18e;--border:#4b4037;--reader:#14110f}button,input{font:inherit}button{min-width:44px;min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--brand);cursor:pointer;flex-shrink:0}button:hover{background:color-mix(in srgb,var(--brand) 9%,transparent)}button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}button:disabled{opacity:.3;cursor:default}svg{width:20px;height:20px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav{display:flex;align-items:center;justify-content:space-between;gap:2px;padding:4px 6px;background:var(--canvas);border-bottom:1px solid var(--border);flex-shrink:0}nav .group{display:flex;align-items:center;gap:2px}#page-label{font-variant-numeric:tabular-nums;color:var(--ink);padding:0 8px;font-size:13px;min-width:72px}#fit{font-size:12px;padding:0 4px;min-width:48px;font-variant-numeric:tabular-nums}#viewport{flex:1;min-height:0;width:100%;overflow:auto;overscroll-behavior:contain;background:var(--reader);touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;position:relative}#pages{width:100%;min-height:100%;padding:8px 0 18px;display:flex;flex-direction:column;align-items:center;gap:10px}.page{width:var(--page-width,100%);flex-shrink:0;position:relative;background:#fff;box-shadow:0 1px 4px #0002;overflow:hidden}.page canvas{display:block;width:100%;height:100%;position:absolute;inset:0}.page-status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;color:#75685e;font-size:12px}.page.retry{cursor:pointer}#status{position:absolute;top:46%;left:24px;right:24px;text-align:center;color:var(--muted);line-height:22px}#error{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--reader);padding:24px;text-align:center;line-height:22px}#error.visible{display:flex}#retry{background:var(--surface);padding:0 18px;border:1px solid var(--border)}#page-counter{position:fixed;bottom:16px;right:14px;pointer-events:none;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--ink);padding:10px 12px;font-variant-numeric:tabular-nums;font-size:12px;box-shadow:0 2px 8px #0001}#page-counter[hidden]{display:none}dialog{border:1px solid var(--border);border-radius:16px;background:var(--canvas);color:var(--ink);padding:20px;max-width:calc(100vw - 32px);width:300px}dialog::backdrop{background:#0006}dialog form{display:flex;flex-direction:column;gap:14px}dialog input{width:100%;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--ink)}dialog .actions{display:flex;justify-content:flex-end;gap:8px}#go{background:var(--brand);color:var(--canvas);padding:0 18px}#jump-error{font-size:12px;color:var(--brand)}
</style>
</head>
<body>
<nav aria-label="PDF controls">
<div class="group"><button id="previous" aria-label="Previous PDF page" disabled><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><button id="page-label" aria-live="polite" aria-label="Jump to PDF page" disabled>Loading…</button><button id="next" aria-label="Next PDF page" disabled><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button></div>
<div class="group"><button id="zoom-out" aria-label="Zoom out" disabled><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button id="fit" aria-label="Fit PDF to screen width" disabled>100%</button><button id="zoom-in" aria-label="Zoom in" disabled><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button></div>
</nav>
<main id="viewport" aria-label="PDF pages, swipe vertically to read"><div id="pages"></div><div id="status" role="status">Opening your document…</div><div id="error" role="alert"><span id="error-message"></span><button id="retry">Try again</button></div></main>
<div id="page-counter" aria-hidden="true" hidden></div>
<dialog id="jump-dialog"><form id="jump-form"><label for="page-input">Go to page</label><input id="page-input" type="number" inputmode="numeric" min="1" value="1"><span id="jump-error" role="alert"></span><div class="actions"><button id="cancel-jump" type="button">Cancel</button><button id="go" type="button">Go</button></div></form></dialog>
<script src="/documents/viewer.js?v=2"></script>
</body>
</html>
